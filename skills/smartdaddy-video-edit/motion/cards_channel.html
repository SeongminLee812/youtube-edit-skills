<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모션 카드(밝은)</title>
<!--
  모션 카드(밝은 스타일, 1920×1080). 원작 cards.html과 같은 키를 받고 색·배치를 토킹헤드용으로 바꿨다. 색·글꼴은 쿼리 theme_accent·theme_accent2·theme_bg·theme_font.
  종류(kind): title(큰 제목, hook 모양) · number · steps · verdict · compare · score · toc(목차) · hook(도입 질문)
  화면에 '설명용 그림·설명용 도식·예시·참고용' 같은 메타 라벨을 넣지 않는다(2026-10-31 사용자). tag는 내용 라벨에만 쓴다.
  배치(place):
    side (기본)  얼굴 옆 세로 카드. side=right(기본)|left. 얼굴 안전영역 x 520–1400·y 0–620과 하단 자막 y 950–1080을 비운다.
                 오른쪽 카드 x 1440–1872, 왼쪽 카드 x 48–480(폭 432, 그림자 포함 얼굴 영역 밖), 세로 y 72–920 안. y=center(기본)|top|bottom
    split        참고 채널식 오른쪽 패널 x 1040–1920. 원본은 CapCut zoom(scale 1.3, x 0.75)으로 진행자를 왼쪽으로. toc용
    full         화면 전체 바탕색. 말로 길게 설명하는 구간에서 2~6초만. 글자는 y 950 위에만 둔다.
    glass        얼굴이 보이는 반투명 카드(toc·hook). 왼쪽 아래 차콜 반투명 판 + 바탕색 글자, 얼굴·아래 18% 비움. 챕터 전환의 기본(2026-10-31 사용자)
  끝 처리: exit=0.45(기본) 마지막 0.45초 동안 빠지고 마지막 프레임은 완전히 투명. exit=0 이면 마지막 0.5초를 멈춘다(CapCut에서 늘려 쓰기).
  값 넘기는 법·[대괄호] 강조·data={JSON}은 cards.html과 같다. 예시는 examples_channel.md.
  렌더:  python scripts/render_motion.py motion/cards_channel.html out --alpha --dur 4 --query "kind=number&title=구독자&from=120&to=480&unit=명"
  브라우저 미리 보기: cards_channel.html?kind=number&to=20&unit=개&play=1&dur=4   (bgimg=그림경로 로 배경 그림을 깔 수 있다. 미리 보기 전용)
  같은 t에는 항상 같은 그림이 나온다. 무작위 값·실제 시계를 쓰지 않는다.
-->
<style>
:root{--iv:#FFFFFF;--bl:#3B5BDB;--ink:#1D2433;--co:#FF6B4A;--sky:#BFD7FF;--mute:rgba(29,36,51,.62);--line:rgba(29,36,51,.12);--card:#FFFCF6;--bl-rgb:59,91,219;--co-rgb:255,107,74;--iv-rgb:255,255,255;--font:'Apple SD Gothic Neo'}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
body{font-family:var(--font),'Apple SD Gothic Neo','AppleSDGothicNeo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-weight:700;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
#fullbg{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--iv) radial-gradient(circle,rgba(29,36,51,.075) 0 2.4px,transparent 2.9px) 12px 12px/48px 48px;opacity:0}
.col{display:flex;flex-direction:column;align-items:center}
.ink{color:var(--ink)}
/* 강조 = 키 컬러 상자 + 바탕색 글자. 살짝만 기울인다 */
.stk{display:inline-block;background:var(--bl);color:var(--iv);padding:.02em .22em .1em;margin:0 .06em;border-radius:.14em;transform:rotate(-1.5deg);letter-spacing:-.01em}
.on .stk{background:var(--iv);color:var(--bl)}
svg{display:block}

/* ───── side: 얼굴 옆 세로 카드 */
.sp{position:absolute;top:0;width:432px;padding:32px 30px 36px;background:var(--iv);border-radius:28px;box-shadow:0 12px 26px rgba(14,20,32,.28),0 2px 5px rgba(14,20,32,.18)}
.hd{font-size:40px;font-weight:800;color:var(--bl);letter-spacing:-.01em;line-height:1.22;word-break:keep-all}
.hd-foot{display:flex;align-items:center;gap:16px;margin:14px 0 24px}
.hd-line{width:56px;height:6px;border-radius:3px;background:var(--bl);transform-origin:0 50%}
.rdots{display:flex;gap:7px;flex:none;margin-left:auto}
.rdots i{display:block;width:11px;height:11px;border-radius:50%;background:rgba(29,36,51,.16)}
.sub{font-size:40px;font-weight:700;color:var(--mute);line-height:1.3;word-break:keep-all}

/* number · side */
.n-from{font-size:40px;font-weight:800;color:var(--mute);white-space:nowrap}
.n-from b{font-weight:800}
.n-arr{width:44px;height:44px;margin:8px 0 2px 2px}
.n-row{display:flex;align-items:baseline;white-space:nowrap}
.n-val{font-size:160px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--bl);text-align:right;font-variant-numeric:tabular-nums}
.n-unit{font-size:56px;font-weight:800;color:var(--ink);margin-left:10px}
.n-bar{position:relative;width:100%;height:14px;margin-top:26px}
.n-track{position:absolute;inset:0;border-radius:7px;background:rgba(29,36,51,.09)}
.n-ghost{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:rgba(var(--bl-rgb),.22)}
.n-fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--bl)}
.sp .n-sub{margin-top:24px}
.n-badge{display:flex;align-items:center;gap:12px;margin-top:24px;font-size:42px;font-weight:800;white-space:nowrap}
.n-badge svg{width:44px;height:44px;flex:none}

/* steps · side */
.st-list{display:flex;flex-direction:column;gap:6px}
.st-row{position:relative;display:flex;align-items:center;gap:18px;margin:0 -16px;padding:0 16px;border-radius:16px}
.st-no{position:relative;flex:none;width:50px;height:50px}
.st-no .d{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(29,36,51,.22);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.st-no svg{position:absolute;inset:0;width:50px;height:50px}
.st-name{font-size:42px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.st-sub{font-size:30px;font-weight:700;color:var(--mute);white-space:nowrap;margin-top:2px}

/* verdict · side */
.vd-hd{display:flex;align-items:center;gap:14px;font-size:40px;font-weight:800;color:var(--bl);white-space:nowrap;margin-bottom:10px}
.vd-hd svg{width:46px;height:46px;flex:none}
.vd-hd.no{color:var(--ink)}
.vd-it{display:flex;align-items:flex-start;gap:12px;font-size:40px;font-weight:700;line-height:1.26;padding:6px 0;word-break:keep-all}
.vd-it .b{flex:none;width:46px;display:flex;justify-content:center;padding-top:.36em}
.vd-it .b i{display:block;width:14px;height:14px;border-radius:50%;background:var(--bl)}
.vd-it.no{color:rgba(29,36,51,.78)}
.vd-it.no .b{padding-top:.3em}
.vd-it.no .b svg{width:22px;height:22px}
.vd-sep{height:2px;background:var(--line);margin:16px 0 18px;transform-origin:0 50%}

/* compare · side */
.cp-lab{font-size:38px;font-weight:800;color:var(--mute);white-space:nowrap}
.cp-val{font-size:108px;font-weight:800;line-height:1.02;letter-spacing:-.03em;white-space:nowrap;font-variant-numeric:tabular-nums}
.cp-val small{font-size:46px;font-weight:800;margin-left:8px;letter-spacing:0}
.cp-blk.b .cp-val{font-size:144px}.cp-blk.b .cp-val small{font-size:56px}
.cp-note{font-size:38px;font-weight:700;color:var(--mute);line-height:1.3;word-break:keep-all;margin-top:4px}
.cp-mid{display:flex;align-items:center;gap:14px;margin:12px 0 10px;font-size:38px;font-weight:800;color:var(--bl)}
.cp-mid svg{width:46px;height:46px}

/* score · side */
.sc-list{display:flex;flex-direction:column;gap:8px}
.sc-row{position:relative;display:flex;align-items:center;margin:0 -16px;padding:6px 16px;border-radius:16px}
.sc-name{font-size:40px;font-weight:800;white-space:nowrap;margin-right:auto}
.sc-valw{position:relative;display:flex;align-items:baseline}
.sc-val{font-size:96px;font-weight:800;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sc-unit{font-size:38px;font-weight:800;margin-left:6px}
.sc-plus{position:absolute;right:100%;top:8%;margin-right:10px;font-size:44px;font-weight:800;white-space:nowrap}

/* ───── full: 화면 전체 */
.full{position:absolute;left:0;top:0;width:1920px;height:950px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fhd{font-size:48px;font-weight:800;color:var(--bl);letter-spacing:-.01em;white-space:nowrap}
.fhd-line{width:96px;height:8px;border-radius:4px;background:var(--bl);margin:22px 0 0}
.fsub{font-size:46px;font-weight:700;color:var(--mute);max-width:1500px;text-align:center;line-height:1.42;word-break:keep-all;text-wrap:balance}
.box{background:var(--card);border:2px solid var(--line);border-radius:26px;box-shadow:0 14px 30px rgba(29,36,51,.08)}
.frd{display:flex;align-items:center;gap:22px}
.frd .rdots i{width:14px;height:14px}
.frd .rdots{gap:10px}

.full .n-row{position:relative;margin-top:30px}
.full .n-val{font-size:300px;line-height:1.02}
.full .n-unit{font-size:100px;margin-left:22px}
.full .n-badge{position:absolute;left:100%;top:14%;margin:0 0 0 34px;font-size:60px;gap:16px}
.full .n-badge svg{width:62px;height:62px}
.full .n-bar{width:1100px;height:22px;margin-top:46px}
.full .n-track,.full .n-ghost,.full .n-fill{border-radius:11px}
.n-fromlab{position:absolute;top:40px;font-size:32px;font-weight:800;color:var(--mute);white-space:nowrap}
.full .n-sub{margin-top:62px}.full .n-sub.lo{margin-top:104px}

.fs-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:28px;margin-top:60px}
.fs-card{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:28px 32px 30px}
.fs-no{font-size:28px;font-weight:800;color:var(--bl);letter-spacing:.06em}
.fs-name{font-size:52px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.fs-sub{font-size:34px;font-weight:700;color:var(--mute);margin-top:8px;white-space:nowrap}
.fs-chk{position:absolute;right:24px;top:24px;width:46px;height:46px}
.fs-list{display:flex;flex-direction:column;gap:16px;margin-top:52px}
.fs-row{width:1240px;display:flex;align-items:center;gap:34px;padding:0 46px}
.fs-row .fs-sub{margin:0 0 0 auto}
.fs-row .fs-chk{position:static;flex:none}

.fv-wrap{display:flex;gap:40px;align-items:stretch;margin-top:50px}
.fv-panel{width:800px;padding:42px 52px 36px}
.fv-hd{display:flex;align-items:center;gap:22px;font-size:52px;font-weight:800;color:var(--bl);padding-bottom:28px;margin-bottom:18px;border-bottom:2px solid var(--line);white-space:nowrap}
.fv-hd.no{color:var(--ink)}
.fv-hd svg{width:62px;height:62px;flex:none}
.fv-it{display:flex;align-items:center;gap:26px;min-height:88px;font-size:46px;font-weight:700;line-height:1.25;word-break:keep-all}
.fv-it .b{flex:none;width:40px;display:flex;justify-content:center}
.fv-it .b i{display:block;width:16px;height:16px;border-radius:50%;background:var(--bl)}
.fv-it.no{color:rgba(29,36,51,.78)}
.fv-it.no .b svg{width:28px;height:28px}

.fc-row{display:flex;align-items:center;margin-top:54px}
.fc-panel{width:760px;min-height:540px;padding:48px 56px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fc-lab{font-size:42px;font-weight:800;color:var(--mute);white-space:nowrap}
.fc-val{font-size:210px;font-weight:800;line-height:1.05;letter-spacing:-.03em;margin-top:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fc-val small{font-size:72px;font-weight:800;margin-left:14px;letter-spacing:0}
.fc-note{font-size:40px;font-weight:700;color:var(--mute);margin-top:20px;max-width:640px;line-height:1.4;word-break:keep-all;text-wrap:balance}
.fc-mid{width:150px;display:flex;justify-content:center}
.fc-mid span{width:104px;height:104px;border-radius:50%;background:var(--bl);color:var(--iv);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;white-space:nowrap}
.fc-mid svg{width:54px;height:54px}

.fsc-row{display:flex;gap:48px;margin-top:60px}
.fsc-card{position:relative;height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fsc-name{font-size:54px;font-weight:800;white-space:nowrap}
.fsc-valw{position:relative;display:flex;align-items:baseline;margin-top:6px}
.fsc-val{font-size:260px;font-weight:800;line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fsc-unit{font-size:70px;font-weight:800;margin-left:10px}
.fsc-plus{position:absolute;left:100%;top:14%;margin-left:12px;font-size:60px;font-weight:800;white-space:nowrap}

/* ───── split: 참고 채널식 오른쪽 패널. 진행자는 CapCut zoom(scale 1.3, x 0.75)으로 왼쪽으로 민다 */
.split{position:absolute;left:1040px;top:0;width:880px;height:1080px;background:var(--iv);box-shadow:-16px 0 36px rgba(14,20,32,.22)}
.split-in{position:absolute;left:88px;right:88px;top:0;height:950px;display:flex;flex-direction:column;justify-content:center}
.split .hd{font-size:46px}
.tag{display:inline-block;align-self:flex-start;font-size:24px;font-weight:700;color:var(--mute);border:2px solid var(--line);border-radius:8px;padding:2px 10px;margin-bottom:14px;white-space:nowrap}
.full .tag{align-self:center;margin:18px 0 0}

/* number v2: 0 기준 막대 두 줄 + 늘어난 부분 */
.nb-big{display:flex;align-items:baseline;white-space:nowrap;transform-origin:0 70%}
.full .nb-big{transform-origin:50% 70%;margin-top:26px}
.full .nb-big .n-val{font-size:280px}.full .nb-big .n-unit{font-size:96px;margin-left:20px}
.nb-bars{position:relative;margin-top:28px;width:100%}
.full .nb-bars{width:1320px;margin-top:40px}
.nb-row{position:relative;margin-top:16px}
.nb-lab{font-size:36px;font-weight:800;color:var(--mute);white-space:nowrap;margin-bottom:8px}
.nb-lab b{color:var(--ink)}
.full .nb-row{display:flex;align-items:center;gap:28px;margin-top:22px}
.full .nb-lab{width:300px;flex:none;text-align:right;margin:0;font-size:44px}
.nb-track{position:relative;height:30px;flex:1;border-radius:8px;background:rgba(29,36,51,.06)}
.full .nb-track{height:48px;border-radius:12px}
.nb-base{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:rgba(29,36,51,.34)}
.nb-grow{position:absolute;top:0;bottom:0;border-radius:0 8px 8px 0;background:var(--bl)}
.full .nb-grow{border-radius:0 12px 12px 0}
.nb-guide{position:absolute;top:0;bottom:0;width:0;border-left:3px dashed rgba(29,36,51,.45)}
.nb-brk{position:absolute;top:100%;margin-top:10px;height:16px}
.nb-brk i{position:absolute;left:0;right:0;top:0;height:16px;border:4px solid var(--bl);border-top:0;border-radius:0 0 6px 6px;transform-origin:0 50%}
.nb-badge{position:absolute;right:0;top:24px;display:flex;align-items:center;gap:10px;font-size:40px;font-weight:800;white-space:nowrap}
.nb-badge svg{width:42px;height:42px;flex:none}
.full .nb-badge{right:auto;left:50%;font-size:56px;transform:translateX(-50%)}
.nb-bars{margin-bottom:78px}.full .nb-bars{margin-bottom:96px}
.full .nb-badge svg{width:56px;height:56px}
.nb-sub{margin-top:0}

/* toc: 목차. 지금 장만 진하게, 키 컬러 막대가 앞 장에서 옮겨 온다 */
.toc-list{position:relative;margin-top:8px;display:flex;flex-direction:column;gap:30px}
.toc-bar{position:absolute;left:0;top:0;width:8px;border-radius:4px;background:var(--bl)}
.toc-row{position:relative;display:flex;gap:20px;padding-left:34px;align-items:flex-start}
.toc-no{font-size:40px;font-weight:800;color:var(--bl);line-height:1.22;min-width:56px;font-variant-numeric:tabular-nums}
.toc-t{font-size:50px;font-weight:800;line-height:1.22;letter-spacing:-.015em;word-break:keep-all}
.toc-s{font-size:32px;font-weight:700;color:var(--mute);margin-top:6px;word-break:keep-all}
.toc-ck{position:absolute;right:0;top:4px;width:42px;height:42px}
.sp .toc-list{gap:20px}.sp .toc-row{padding-left:26px;gap:14px}.sp .toc-no{font-size:32px;min-width:42px}.sp .toc-t{font-size:38px}.sp .toc-s{font-size:28px}.sp .toc-ck{width:36px;height:36px}

/* ───── 전체 화면 카드: 머리표, hook·title, 목차 전체 화면 */
.eb{position:absolute;left:96px;top:54px;display:flex;align-items:center;gap:14px;font-size:26px;font-weight:800;color:var(--bl);white-space:nowrap}
.eb i{display:block;width:38px;height:7px;border-radius:2px;background:var(--bl)}
.hk{width:1640px;display:flex;flex-direction:column;align-items:flex-start}
.hk-q{font-size:124px;font-weight:800;letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.hk-s{font-size:58px;font-weight:700;color:var(--mute);margin-top:28px;white-space:nowrap}
.hk-opts{display:flex;gap:30px;margin-top:72px;width:100%}
.hk-opt{flex:1;height:184px;border-radius:26px;background:var(--card);border:4px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:800;box-shadow:0 14px 30px rgba(29,36,51,.08)}
.fs-list.big{gap:24px}.fs-list.big .fs-row{width:1440px;padding:0 56px}.fs-list.big .fs-no{font-size:36px}.fs-list.big .fs-name{font-size:64px}.fs-list.big .fs-sub{font-size:38px}.fs-list.big .fs-chk{width:58px;height:58px}
.fs-note{margin-top:50px;font-size:46px;font-weight:800;color:var(--bl);text-align:center;word-break:keep-all}
.tocw{width:1300px}
.toc-hd{font-size:46px;font-weight:800;color:var(--bl)}
.tocw .hd-line{width:72px;height:8px;border-radius:4px;margin:18px 0 0}
.full .toc-list{gap:44px;margin-top:52px}
.full .toc-row{padding-left:48px;gap:30px}
.full .toc-no{font-size:58px;min-width:86px}
.full .toc-t{font-size:74px}
.full .toc-s{font-size:40px;margin-top:8px}
.full .toc-ck{width:60px;height:60px;top:14px}
.full .toc-bar{width:11px;border-radius:6px}
.full .hd-foot .hd-line{width:96px;height:9px}

/* compare 도식: 요일 칸 */
.wk{display:flex;gap:10px;margin-top:22px}
.wk span{width:62px;height:76px;border-radius:12px;border:3px solid rgba(29,36,51,.18);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:rgba(29,36,51,.45)}
.wk span.on{border-color:var(--bl)}
.wk span.opt{border-style:dashed}
.wk span b{position:absolute;inset:-3px;border-radius:12px;background:var(--bl);color:var(--iv);display:flex;align-items:center;justify-content:center;font-weight:800}
.wk span{position:relative}
.fc-val.wkv{font-size:120px}.fc-val.wkv small{font-size:52px}

/* ───── glass(v5, 2026-10-31): 얼굴이 보이는 반투명 알파 카드. 2026-10-18 챕터 자리(왼쪽 아래)에 차콜 반투명 판 + 바탕색 글자.

      grow.style.width = ((frac(to) - frac(from)) * 100 * q).toFixed(3) + '%';

      const bt = at + roll - .15, bp = sp(t - bt, 'snappy');
      brkI.style.transform = `scaleX(${bp.toFixed(4)})`; brkI.style.opacity = bp > .01 ? 1 : 0;
      bdg.style.opacity = sp(t - (bt + .12), 'snappy').toFixed(3);
      stamp([bStk], t, bt + .12);
      if (sub) rise(sub, t, at + roll + .1);
    } };
}

// ───────── 6. toc: 목차. 지난 장은 보조색 체크, 지금 장만 진하게, 키 컬러 막대가 앞 장에서 지금 장으로 옮겨 온다
function kToc(R) {
  const raw = Array.isArray(D.items) ? D.items : list(D.items).filter(x => x !== '');
  const subs = list(D.subs);
  const items = raw.slice(0, 5).map((it, i) => it && typeof it === 'object' ? { t: str(it.t ?? it.name), s: str(it.sub) } : { t: str(it), s: str(subs[i]) });
  if (!items.length) throw new Error('toc에 items가 없습니다');
  const now = clamp(Math.round(num(D.now, 1)), 1, items.length) - 1;
  const prev = has(D.prev) ? Math.round(num(D.prev)) - 1 : now - 1;
  const at = num(D.at, 1.1);
  let h, box;
  if (isSide) { h = head(R, str(D.title, str(D.label, '목차'))); box = add('<div class="toc-list"><div class="toc-bar"></div></div>', R) }
  else {                                                 // 전체 화면: 왼쪽 정렬 목록(참고 채널 목차처럼)
    const w = add(`<div class="tocw"><div class="toc-hd an">${rich(str(D.title, '목차'))}</div><div class="hd-line"></div><div class="toc-list"><div class="toc-bar"></div></div></div>`, R);
    h = { e: w, txt: $('.toc-hd', w), ln: $('.hd-line', w), dots: [] }; box = $('.toc-list', w);
  }
  const bar = $('.toc-bar', box);
  const rows = items.map((it, i) => { const e = add(`<div class="toc-row an"><div class="toc-no">${String(i + 1).padStart(2, '0')}</div><div class="toc-tx"><div class="toc-t">${rich(it.t)}</div>${it.s ? `<div class="toc-s">${rich(it.s)}</div>` : ''}</div>${i < now ? `<div class="toc-ck an">${ICON.check()}</div>` : ''}</div>`, box);
    return { e, no: $('.toc-no', e), t: $('.toc-t', e), s: $('.toc-s', e), ck: $('.toc-ck', e) } });
  let Y = [];
  return {
    lay() { if (h) fit(h.txt, IW); rows.forEach(r => r.t.style.paddingRight = r.ck ? '52px' : '0'); Y = rows.map(r => [r.e.offsetTop, r.e.offsetTop + r.e.offsetHeight]) },
    upd(t) {
      headUpd(h, t);
      rows.forEach((r, i) => {
        rise(r.e, t, .3 + i * .09, .55);
        const cur = i === now ? sp(t - at, 'default') : 0, was = i === prev ? 1 - sp(t - at, 'snappy') : 0, k = Math.max(cur, was * (prev >= 0 ? 1 : 0));
        r.t.style.color = mixRGB([160, 164, 172], C.ink, k);
        r.no.style.color = mixRGB([170, 182, 220], C.bl, k);
        if (r.s) { r.s.style.opacity = (.55 + .45 * k).toFixed(3) }
        if (r.ck) S(r.ck, { s: lerp(.6, 1, sp(t - (.5 + i * .09), 'snappy')), o: sp(t - (.5 + i * .09), 'snappy') });
      });
      const st0 = prev >= 0 ? Y[prev] : Y[now], [a, b] = indicator(t, [[0, st0[0], st0[1]], [at, Y[now][0], Y[now][1]]]);
      bar.style.top = a.toFixed(2) + 'px'; bar.style.height = Math.max(0, b - a).toFixed(2) + 'px';
      bar.style.opacity = sp(t - .55, 'snappy').toFixed(3);
    } };
}

// ───────── 9. hook: 도입 질문(전체 화면). 큰 인용 → 보조 문장 → 보기 칸이 하나씩, 지금 나온 칸만 키 컬러
function kHook(R) {
  const opts = list(D.items).filter(x => x !== '');
  const w = add(`<div class="hk"><div class="hk-q an">${rich(str(D.title))}</div>${has(D.sub) ? `<div class="hk-s an">${rich(D.sub)}</div>` : ''}
    <div class="hk-opts">${opts.map(o => `<div class="hk-opt an">${rich(o)}</div>`).join('')}</div></div>`, R);
  const q = $('.hk-q', w), sb = $('.hk-s', w), os = $$('.hk-opt', w);
  return {
    lay() { fit(q, 1640, .6); if (sb) fit(sb, 1640, .7) },
    upd(t, dur, end) {
      rise(q, t, .1, .6); if (sb) rise(sb, t, .7);
      const A = evenly(os.length, 1.3, Math.max(1.4, end - .8));
      os.forEach((e, i) => { const a = A[i], on = sp(t - a, 'snappy') * (i < os.length - 1 ? 1 - sp(t - A[i + 1], 'snappy') : 1);
        rise(e, t, a, .5); e.style.borderColor = mixRGB([226, 223, 214], C.bl, on); e.style.color = mixRGB(C.ink, C.bl, on) });
    } };
}

// ───────── 18. glass(v5): 얼굴이 보이는 반투명 카드 — toc(챕터 목차)·hook(도입 질문). 왼쪽 아래(x 64~), 마지막 줄 아래 끝 y 872
//   판(배경)·키 컬러 표시·글자를 따로 둔다: 키 컬러 표시가 판 위, 글자 아래로 지나가야 해서
const GA = () => String(clamp(num(D.ga, .5), .2, .9));
function kTocGlass(R) {
  R.style.setProperty('--ga', GA());
  const items = (Array.isArray(D.items) ? D.items : list(D.items).filter(x => x !== '')).slice(0, 4).map(v => str(v.t ?? v));
  if (!items.length) throw new Error('toc에 items가 없습니다');
  // now=0: 강조 없는 목록(키 컬러 표시·체크 없음, 모든 줄 같은 밝기). rowat=초|초|…: 줄마다 등장 시각(없으면 거의 함께). 2026-11-03 예시 영상 도입 '얻을 것'
  const plain = Math.round(num(D.now, 1)) === 0, rowAt = list(D.rowat).map(Number);
  const now = plain ? -1 : clamp(Math.round(num(D.now, 1)), 1, items.length) - 1, prev = plain ? -1 : has(D.prev) ? Math.round(num(D.prev)) - 1 : now - 1;
  const at = num(D.at, .8), x = num(D.x, 64), rh = num(D.rh, 60), gap = num(D.gap, 8), n = items.length;
  const y0 = num(D.ytop, 872 - n * rh - (n - 1) * gap), Y = i => y0 + i * (rh + gap), ebH = 46, ebY = y0 - ebH - 10;
  const ebPl = add(`<div class="gl-pl" style="left:${x}px;top:${ebY}px;height:${ebH}px"></div>`, R);
  const pls = items.map((_, i) => add(`<div class="gl-pl" style="left:${x}px;top:${Y(i)}px;height:${rh}px"></div>`, R));
  const ind = add(`<div class="gl-ind" style="left:${x}px"></div>`, R);
  const eb = add(`<div class="gl-tx gl-eb" style="left:${x}px;top:${ebY}px;height:${ebH}px;padding:0 20px 0 18px"><i></i><span>${esc(str(D.label, '목차'))}</span></div>`, R);
  const rows = items.map((t, i) => { const e = add(`<div class="gl-tx" style="left:${x}px;top:${Y(i)}px;height:${rh}px;padding:0 26px 0 22px"><span class="gt-no">${String(i + 1).padStart(2, '0')}</span><span class="gt-t">${rich(t)}</span>${i < now ? `<span class="gt-ck">${ICON.check()}</span>` : ''}</div>`, R);
    return { e, no: $('.gt-no', e), t: $('.gt-t', e), ck: $('.gt-ck', e) } });
  let W = [];
  return {
    lay() { ebPl.style.width = eb.offsetWidth + 'px'; W = rows.map(r => r.e.offsetWidth); pls.forEach((p, i) => p.style.width = W[i] + 'px') },
    upd(t) {
      push(ebPl, t, .05, .5, -1, {}, 40); push(eb, t, .05, .5, -1, {}, 40);
      rows.forEach((r, i) => { const a = isFinite(rowAt[i]) ? rowAt[i] : .14 + i * .08;
        push(pls[i], t, a, .5, -1, {}, 40); push(r.e, t, a, .5, -1, {}, 40);
        const k = plain ? 1 : i === now ? sp(t - at, 'default') : i === prev ? 1 - sp(t - at, 'snappy') : 0;
        r.t.style.color = `rgba(${THEME.ivs},${lerp(.6, 1, k).toFixed(3)})`; r.no.style.color = `rgba(${THEME.ivs},${lerp(.5, 1, k).toFixed(3)})`;
        if (r.ck) S(r.ck, { o: sp(t - (i === prev ? at + .2 : a + .3), 'snappy') });   // 바로 앞 장은 키 컬러 표시가 떠난 뒤 체크
      });
      if (plain) { ind.style.opacity = '0'; return }
      const from = prev >= 0 ? prev : now, mv = sp(t - at, 'default');
      const [a, b] = indicator(t, prev >= 0 ? [[0, Y(prev), Y(prev) + rh], [at, Y(now), Y(now) + rh]] : [[0, Y(now), Y(now) + rh]]);
      ind.style.top = a.toFixed(2) + 'px'; ind.style.height = Math.max(0, b - a).toFixed(2) + 'px';
      ind.style.width = lerp(W[from], W[now], prev >= 0 ? mv : 1).toFixed(2) + 'px';
      ind.style.opacity = sp(t - (prev >= 0 ? .45 : at), 'snappy').toFixed(3);
    } };
}
function kHookGlass(R) {
  R.style.setProperty('--ga', GA());
  const opts = list(D.items).filter(x => x !== ''), ats = list(D.at).map(Number);
  const x = num(D.x, 64), oh = num(D.oh, 70), og = 12, oy = num(D.oy, 872 - oh);
  const boxPl = add('<div class="gl-pl"></div>', R);
  const opPl = opts.map(() => add(`<div class="gl-pl" style="top:${oy}px;height:${oh}px"></div>`, R));
  const box = add(`<div class="gl-tx gh-box" style="left:${x}px;padding:8px 30px 14px 28px"><div class="gh-q">${rich(str(D.title))}</div>${has(D.sub) ? `<div class="gh-s">${rich(D.sub)}</div>` : ''}</div>`, R);
  const q = $('.gh-q', box), sb = $('.gh-s', box);
  const ops = opts.map(o => add(`<div class="gl-tx gh-o" style="top:${oy}px;height:${oh}px">${rich(o)}</div>`, R));
  let A = [];
  return {
    lay() {
      const h = box.offsetHeight, top = oy - 10 - h; box.style.top = top + 'px';   // 위 끝이 y 620(얼굴 영역) 아래에 오도록
      Object.assign(boxPl.style, { left: x + 'px', top: top + 'px', width: box.offsetWidth + 'px', height: h + 'px' });
      const ow = Math.max(...ops.map(e => e.offsetWidth)) + 56;
      ops.forEach((e, i) => { const l = x + i * (ow + og); e.style.left = opPl[i].style.left = l + 'px'; e.style.width = opPl[i].style.width = ow + 'px' });
      A = opts.map((_, i) => has(ats[i]) && isFinite(ats[i]) ? ats[i] : 1.3 + i * 1.2);
    },
    upd(t) {
      push(boxPl, t, .1, .6, -1, {}, 40); push(q, t, .1, .6, -1, {}, 40); if (sb) push(sb, t, .7, .55, -1, {}, 30);
      ops.forEach((e, i) => { const a = A[i], on = sp(t - a, 'snappy') * (i < ops.length - 1 ? 1 - sp(t - A[i + 1], 'snappy') : 1);
        push(opPl[i], t, a, .45, -1, {}, 40); push(e, t, a, .45, -1, {}, 40);   // 아래에서 올라오면 자막 띠(y 886)에 걸려 옆에서 들어온다
        opPl[i].style.background = `rgba(${mixRGB(C.ink, C.bl, on).slice(4, -1)},${lerp(+GA(), .88, on).toFixed(3)})`;
        e.style.color = `rgba(${THEME.ivs},${lerp(.82, 1, on).toFixed(3)})` });
    } };
}

// ───────── 조립
const KINDS = { title: R => PLACE === 'glass' ? kHookGlass(R) : kHook(R), number: R => has(D.from) && D.style !== 'roll' ? kNumberBars(R) : kNumber(R), steps: kSteps, verdict: kVerdict, compare: kCompare, score: kScore, toc: R => PLACE === 'glass' ? kTocGlass(R) : kToc(R), hook: R => PLACE === 'glass' ? kHookGlass(R) : kHook(R) };
let card, root, panel = null, rs = 1, EB = null;
function mkRoot() {
  stage.querySelectorAll('.sp,.full,.split,.gl').forEach(e => e.remove());
  if (PLACE === 'glass') root = add('<div class="gl"></div>', stage);
  else if (isSplit) { panel = add('<div class="split"></div>', stage); root = add('<div class="split-in"></div>', panel) }
  else if (isSide) { root = add('<div class="sp"></div>', stage); root.style.left = (SIDE === 'right' ? 1440 : 48) + 'px' }   // 오른쪽 1440–1872, 왼쪽 48–480
  else { root = add('<div class="full"></div>', stage); if (has(D.eyebrow)) EB = add(`<div class="eb an"><i></i><span>${esc(D.eyebrow)}</span></div>`, stage) }
}
function fail(msg) {
  mkRoot(); const e = add(`<div class="${isSide ? 'hd' : 'fhd'}">카드 오류</div>`, root); add(`<div class="${isSide ? 'sub' : 'fsub'}" style="margin-top:16px">${esc(msg)}</div>`, root);
  card = { lay() {}, upd() {} }; setTimeout(() => { throw new Error(msg) });
}
try {
  if (ERR) throw new Error(ERR);
  const k = D.kind ?? 'number';
  if (!KINDS[k]) throw new Error(`kind=${k} 는 없는 종류입니다. title · number · steps · verdict · compare · score · toc · hook 중 하나`);
  mkRoot(); card = KINDS[k](root);
} catch (e) { fail(e.message) }

if (has(D.bgimg) && !ALPHA) document.body.style.background = `#000 url("${encodeURI(D.bgimg)}") center/cover no-repeat`;
else if (!ALPHA) document.body.style.background = has(D.bg) ? D.bg : '#000';

let laid = false, top0 = 0;
const Y0 = 72, Y1 = has(D.ybot) ? num(D.ybot) : 920;      // ybot: 카드 아래 끝 상한(예: 하단 18% 위 870)
function place() {
  if (!isSide || isSplit) return;
  root.style.transform = 'none'; const h = root.offsetHeight;
  rs = h > Y1 - Y0 ? (Y1 - Y0) / h : 1; root.style.transformOrigin = '50% 0';
  const hh = h * rs, mode = D.y === 'top' ? 'top' : D.y === 'bottom' ? 'bottom' : 'center';
  top0 = mode === 'top' ? Y0 : mode === 'bottom' ? Y1 - hh : Math.round(clamp((Y0 + Y1) / 2 - hh / 2, Y0, Y1 - hh));
  root.style.top = top0 + 'px';
}
window.render = function (t, dur) {
  dur = +dur > 0 ? +dur : 4;
  const end = EXIT > 0 ? Math.max(.6, dur - EXIT) : Math.max(0, dur - .5);   // 내용이 움직이는 끝
  const tc = clamp(+t || 0, 0, end);
  if (!laid) { card.lay(); place(); laid = document.fonts.status === 'loaded' }
  card.upd(tc, dur, end);
  const tt = clamp(+t || 0, 0, dur);
  const pout = EXIT > 0 ? E.sine(P(tt, dur - EXIT, dur - .05)) : 0;          // 마지막 프레임은 완전히 투명
  if (PLACE === 'glass') {                             // 요소마다 왼쪽에서 들어오고, 끝에 함께 왼쪽으로 빠진다
    S(root, { x: -36 * pout, o: 1 - pout, b: 4 * pout });
  } else if (isSplit) {                                // 오른쪽에서 밀려 들어오고 오른쪽으로 빠진다(투명도만으로 드나들지 않음)
    const pin = sp(tt, 'default'), po = EXIT > 0 ? sp(tt - (dur - EXIT), 'snappy') : 0;
    S(panel, { x: 940 * (1 - pin) + 940 * po, o: tt > 0 ? 1 : 0 });          // 940 = 패널 폭 + 왼쪽 그림자
  } else if (isSide) {
    const dir = SIDE === 'right' ? 1 : -1, pin = E.out4(P(tt, 0, .5));
    S(root, { x: dir * (64 * (1 - pin) + 40 * pout), o: E.out(P(tt, 0, .3)) * (1 - pout), b: (1 - pin) * 6, s: rs, keep: true });
  } else {
    fullbg.style.opacity = ((BGIN ? E.out(P(tt, 0, .32)) : 1) * (1 - pout)).toFixed(3);
    if (EB) rise(EB, tc, .05);
    S(root, { y: -14 * pout, o: 1 - pout });
  }
};
if (Q.has('play')) { const dur = num(Q.get('dur'), 4), st = performance.now(); const loop = () => { window.render(((performance.now() - st) / 1000) % (dur + .8), dur); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
else { const dur = num(Q.get('dur'), 4); window.render(has(Q.get('t')) ? num(Q.get('t')) : Math.max(0, dur - (EXIT > 0 ? EXIT : .5)), dur) }
</script>
